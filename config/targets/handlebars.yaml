# UoPFuzz Target Configuration for Handlebars
# Popular template engine used by many frameworks

name: "handlebars"
package: "handlebars"
version: "4.7.8"
description: "Handlebars template engine - widely used, high impact"

# Entry points - functions that accept user input
entryPoints:
  - name: "compile"
    inputType: "template"
    description: "Compile template string"
  - name: "precompile"
    inputType: "template"
    description: "Precompile template"

# Dangerous sinks
sinks:
  - "eval"
  - "Function"
  - "child_process.exec"
  - "vm.runInThisContext"

# Properties to pollute
pollutionPoints:
  - "data"
  - "helpers"
  - "partials"
  - "options"
  - "template"
  - "strict"
  - "assumeObjects"
  - "preventIndent"

# Testing configuration
testConfig:
  timeout: 30
  maxDepth: 3
  enableAsyncTesting: false
