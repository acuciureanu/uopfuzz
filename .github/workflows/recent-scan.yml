name: recent-scan

# Hunt for undocumented prototype-pollution gadgets in recently-published npm
# libraries. Informational and self-contained: it never gates other CI. Runs on a
# daily schedule and on demand. See scripts/discovery/README.md.
on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily
  workflow_dispatch:
    inputs:
      since:
        description: 'Only scan packages published since this date (ISO, UTC). Blank = today.'
        required: false
        default: ''
      max:
        description: 'Max targets to scan'
        required: false
        default: '25'

permissions:
  contents: read
  issues: write   # to open a tracking issue when a candidate survives

concurrency:
  group: recent-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - name: Discover recently-updated PP-prone packages
        run: |
          node scripts/discovery/scan-recent.mjs \
            ${{ github.event.inputs.since && format('--since {0}', github.event.inputs.since) || '' }} \
            --max "${{ github.event.inputs.max || '25' }}" \
            --out targets.txt
          echo "----- targets -----"; cat targets.txt || true

      - name: Sweep targets through the hardened sandbox
        run: scripts/discovery/sweep.sh targets.txt 30 15

      - name: Triage
        id: triage
        # triage exits 2 when a candidate needs human eyes; capture it, don't fail the job.
        run: |
          set +e
          node scripts/discovery/triage.mjs results/hunt --json summary.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload sweep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recent-scan-${{ github.run_id }}
          path: |
            targets.txt
            summary.json
            results/hunt/**/run.log
            results/hunt/**/results-*.json
          if-no-files-found: warn

      - name: Open a tracking issue for surviving candidates
        if: steps.triage.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(node -e 'console.log(require("./summary.json").candidateCount)')
          {
            echo "The daily recent-scan reproduced **$COUNT** prototype-pollution gadget(s) that are"
            echo "unknown to the static DB, OSV.dev, AND the GitHub Advisory Database."
            echo
            echo "> These are **leads requiring human confirmation**, not published advisories."
            echo "> UoPFuzz is the finder, never the disclosure vehicle — confirm by hand, then"
            echo "> report privately to the maintainer. Do not attach a working exploit to a public issue."
            echo
            echo "Candidates (PoCs are in the run artifact, not inlined here):"
            node -e 'for (const c of require("./summary.json").candidates) console.log(`- \`${c.target}\` — Object.prototype.${c.prop} via ${c.entry} (${c.proof}${c.regressionSuspect?", regression-suspect":""})`)'
            echo
            echo "Artifact: run \`${{ github.run_id }}\` → \`recent-scan-${{ github.run_id }}\`."
          } > body.md
          gh issue create \
            --title "recent-scan: $COUNT undocumented PP candidate(s) — needs triage" \
            --body-file body.md \
            --label "security,needs-triage" || true
